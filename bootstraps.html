<html>
    <head>
        <title>My Hobby Cards</title>

        <link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css" rel="stylesheet"
            integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe" crossorigin="anonymous">
        
        <script type="module" src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-1a/pXj49ZQ1aHEmrJ+gMw1otqoVsYwlEnlD8mIfY2TV03r20Y0CN7uqx1tQogjPL" crossorigin="anonymous"></script>

        <style>
            body {
                background-color: white;
                font-family: Arial, sans-serif;
                padding:30px 15px;
            }

            h1 {
                text-align: center;
                color: red;
            }

            .hobby-card {
                text-align: center;
                border: 2px solid red;
                border-radius: 8px;
                padding: 20px;
                margin-bottom: 20px;
                background-color: white;
            }

            .hobby-card h3 {
                color: red;
            }
        </style>
    </head>
    <body>
        <h1>My Hobby Cards</h1>

        <div class="container">
            <div class="row">
                
                <div class="col-12 col-md-6 col-lg-4">
                    <div class="hobby-card">
                        <h3>Drawing</h3>
                        <p>I love sketching anime characters!</p>
                    </div>
                </div>

                <div class="col-12 col-md-6 col-lg-4">
                    <div class="hobby-card">
                        <h3>Football</h3>
                        <p>I play football every evening with my friends.</p>
                    </div>
                </div>

                <div class="col-12 col-md-12 col-lg-4">
                    <div class="hobby-card">
                        <h3>Reading</h3>
                        <p>I love reading adventure stories about brave heroes.</p>
                    </div>
                </div>
            </div>
        </div>
    </body>
</html>
