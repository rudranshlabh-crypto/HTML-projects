<html>
    <head>
        <title>My Animal Fact File</title>
        <style>

            body {
                background-color: darkgreen;
                font-family: Arial, sans-serif;
            }

            .fact-file {
                background-color: lightyellow;
                color: darkslategray;
                width: 260px;
                padding: 25px;
                border: 10px solid forestgreen;
                margin: 30px;
            }

            .animal-name {
                color: forestgreen;
                font-size: 22px;
            }

            .detail {
                color: darkslategray;
            }

            .cool-fact {
                color: darkorange;
                font-style: italic;
            }
        </style>
    </head>
    <body>

        <div class="fact-file">
            <h2 class="animal-name">Snow Leopard</h2>
            <p class="detail">Type: Big Cat</p>
            <p class="detail">Lives in the mountain ranges of Central Asia</p>
            <p class="detail">Diet: Deer, goats, and wild sheep</p>
            <p class="cool-fact">Cool Fact: Snow
                leopards can leap up to 15 meters in a single jump!
            </p>
            <img scr="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRE_vDYkBpq5pEkhau4UBctW6n3UR-ouWlmnumAQn4NJA&s=10">
        </div>
    </body>
</html>
