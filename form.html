<html>
    <head>
        <title>Book Donation Form</title>
    </head>
    <body>
        <h1>Book Donation Form</h1>
        <form>
            <label for="name">Name:</label>
            <input type="text" id="name" name="name" required><br><br>

            <label for="email">Email:</label>
            <input type="email" id="email" name="email" required><br><br>

            <label for="book-title">Book Title:</label>
            <input type="text" id="book-title" name="book-title" required><br><br>

            <label for="book-author">Book Author:</label>
            <input type="text" id="book-author" name="book-author" required><br><br>

            <label for="donation-message">Donation Message:</label>
            <textarea id="donation-message" name="donation-message"></textarea><br><br>

            <input type="submit" value="Submit">
        </form>
    </body>
</html>
