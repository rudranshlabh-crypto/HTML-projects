<html>
    <head>
        <title>My Superhero Card</title>
        <style>
            body {
                background-color: darkblue;
                color: white;
                font-family: Arial, sans-serif;
            }

            .hero-name {
                font-size: 60px;
                font-weight: bold;
                color: yellow;
                text-shadow: 3px 3px orange;
            }

            .tagline {
                font-style: italic;
                color: lightblue;
                text-transform: uppercase;
            }

            .label {
                text-transform: uppercase;
                text-decoration: underline;
                color: coral;
            }
        </style>
    </head>
    <body>
    
        <h1 class="hero-name">Thunder Kid</h1>
        <p class="tagline">The most powerful hero in the school.</p>
    
        <h2 class="label">Superpowers</h2>
        <p class="power">Can run faster than cheetah.</p>
        <p class="power">Can lift heavy objects.</p>
    
        <h2 class="label">Weaknesses</h2>
        <p class="weaknesses">Maths homework</p>
        <p class="weaknesses">Broccoli</p>
    
        <p class="badge">Top Hero</p>
    
        <p class="made-by">Created by: Rudransh Labh</p>
    </body>
</html>
